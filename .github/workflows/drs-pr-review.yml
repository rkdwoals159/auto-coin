name: DRS PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  drs-pr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Run DRS PR Reviewer AI
        uses: rkdwoals159/pr-ai-reviewer@main
        with:
          # DRS API가 준비되어 있다면, 아래 두 값을 이 레포의 GitHub Secrets에 설정해서 사용하세요.
          # 설정하지 않으면, pr-ai-reviewer 레포의 mock 위험도 계산 로직으로 동작합니다.
          drs-api-base-url: https://worldofcode.org/drs-api/
          drs-api-token: ${{ secrets.DRS_API_TOKEN }}
        env:
          # GitHub Actions에서 자동으로 주입되는 토큰을 사용합니다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
